---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "soft_serve_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Soft Serve settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - soft_serve_identifier
    - soft_serve_uid
    - soft_serve_gid
    - soft_serve_hostname
    - soft_serve_container_network
    - soft_serve_container_bind_port
    - soft_serve_ssh_public_url
    - soft_serve_initial_admin_key

# Soft Serve refuses to parse an unknown access level and exits before it ever
# starts listening, so catching a typo here saves a crash loop later.
- name: Fail if the Soft Serve anonymous access level is not one Soft Serve knows
  ansible.builtin.fail:
    msg: >-
      `soft_serve_anon_access` is set to `{{ soft_serve_anon_access }}`, which Soft Serve does not
      understand. Use one of: no-access, read-only, read-write, admin-access - or leave it empty
      to let Soft Serve's own stored setting govern.
  when: "soft_serve_anon_access | string | length > 0 and soft_serve_anon_access not in ['no-access', 'read-only', 'read-write', 'admin-access']"
